name: Hypermeme
options:
  bundleIdPrefix: dev.alexis
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    # Sparkle compares build numbers, so they follow the version: a 1.2.3 build updates to 1.2.4.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Hypermeme:
    type: application
    platform: macOS
    sources:
      - path: Hypermeme
        excludes:
          - Info.plist
    dependencies:
      - package: Sparkle
    scheme:
      testTargets:
        - HypermemeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alexis.Hypermeme
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, the menu bar setting and the URL scheme, which the generated Info.plist has no settings for.
        INFOPLIST_FILE: Hypermeme/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hypermeme
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  HypermemeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Hypermeme
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.alexis.Hypermeme.tests
        CODE_SIGN_IDENTITY: "-"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
